[project]
name = "ragscope-backend"
version = "0.1.0"
description = "RAGScope backend: observable vector + knowledge-graph RAG pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.21",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "chromadb>=1.5",
    "sentence-transformers>=6.0",
    "tiktoken>=0.7",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "markdown>=3.6",
    "numpy>=1.26",
    "openai>=1.40",
    "networkx>=3.2",
    "neo4j>=5.20",
    "presidio-analyzer>=2.2",
    "spacy>=3.7",  # + model en_core_web_sm (python -m spacy download en_core_web_sm)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "black>=24", "fpdf2>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
