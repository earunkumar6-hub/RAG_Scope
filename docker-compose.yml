# RAGScope — full stack with one command:
#   docker compose up --build       UI http://localhost:3000, API http://localhost:8010, Neo4j http://localhost:7474
#   docker compose run --rm --no-deps backend pytest     backend tests
# The backend runs in development mode (source bind-mounted, auto-reload). The frontend service is
# a production build; for frontend development run `npm run dev` in ./frontend on the host.

services:
  backend:
    build: ./backend
    ports:
      - "8010:8000" # host 8000 is often taken
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      HF_HOME: /cache/huggingface
      WATCHFILES_FORCE_POLLING: "true" # file events don't cross a Windows bind mount
      # Knowledge graph in the neo4j service. Set NEO4J_URI= (empty) in .env to use the local
      # NetworkX store instead.
      NEO4J_URI: ${NEO4J_URI-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphrag-dev}
    volumes:
      - ./backend:/app # live source; dependencies stay in the image
      - backend-data:/data # SQLite, Chroma, uploads, eval indexes, runtime config
      - model-cache:/cache/huggingface # bge embedder + reranker, downloaded once
    depends_on:
      neo4j:
        condition: service_healthy
    command: ["uvicorn", "--factory", "app.main:create_app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8010 # the browser calls the API on the host port
    ports:
      - "3000:3000" # must match the backend's CORS_ORIGINS
    depends_on:
      backend:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graphrag-dev}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  backend-data:
  model-cache:
  neo4j-data:
